# Publishes docs/ — the privacy policy, the terms, and a page about the app.
#
# Both stores require the privacy policy at a URL before they will accept a
# submission, and a file in a repository is not a URL. This is the cheapest way
# to have one: GitHub Pages, from the same markdown the app embeds, so a
# reviewer's page and the text on the phone cannot drift apart.
#
# Pages is switched on and serves docs/ from main directly, so this job does not
# deploy anything. It guards the thing that breaks quietly: docs/ is generated
# from the markdown by tools/build.sh and committed, so the two can drift.
name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'PRIVACY.md'
      - 'TERMS.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One at a time, and let a newer push wait rather than cancel — a half-deployed
# policy page is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/ is generated by tools/build.sh from PRIVACY.md and TERMS.md, and
      # it is committed — but if the markdown moved without a rebuild, this
      # catches it rather than publishing yesterday's words.
      - name: Check docs/ matches the markdown
        run: |
          python3 - <<'PY'
          import pathlib, sys
          exec(open('tools/_mdhtml.py').read())
          for md, page in (('PRIVACY.md','docs/privacy.html'), ('TERMS.md','docs/terms.html')):
              body = md_to_html(md)
              have = pathlib.Path(page).read_text(encoding='utf-8')
              head = body.split('\n')[0]
              if head not in have:
                  sys.exit(f'{page} is behind {md} — run ./tools/build.sh and commit docs/')
          print('docs/ is current')
          PY

      # Pages serves docs/ from the branch directly, so there is nothing here to
      # deploy — GitHub does it. What is left is the part that can go wrong
      # silently: docs/ is generated and committed, so it can fall behind the
      # markdown it came from, and the page a store reviewer reads to decide
      # whether this app is honest is the last one that should be stale.
      - name: Confirm the published pages are reachable
        run: |
          for p in "" privacy.html terms.html; do
            url="https://saurabhrathi00.github.io/ev_route_planner/$p"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$code  $url"
            [ "$code" = "200" ] || echo "::warning::$url answered $code"
          done
