# Publishes docs/ — the privacy policy, the terms, and a page about the app.
#
# Both stores require the privacy policy at a URL before they will accept a
# submission, and a file in a repository is not a URL. This is the cheapest way
# to have one: GitHub Pages, from the same markdown the app embeds, so a
# reviewer's page and the text on the phone cannot drift apart.
#
# `enablement: true` turns Pages on the first time this runs, using the token
# the workflow already has — so there is nothing to click in Settings.
name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'PRIVACY.md'
      - 'TERMS.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One at a time, and let a newer push wait rather than cancel — a half-deployed
# policy page is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # docs/ is generated by tools/build.sh from PRIVACY.md and TERMS.md, and
      # it is committed — but if the markdown moved without a rebuild, this
      # catches it rather than publishing yesterday's words.
      - name: Check docs/ matches the markdown
        run: |
          python3 - <<'PY'
          import pathlib, sys
          exec(open('tools/_mdhtml.py').read())
          for md, page in (('PRIVACY.md','docs/privacy.html'), ('TERMS.md','docs/terms.html')):
              body = md_to_html(md)
              have = pathlib.Path(page).read_text(encoding='utf-8')
              head = body.split('\n')[0]
              if head not in have:
                  sys.exit(f'{page} is behind {md} — run ./tools/build.sh and commit docs/')
          print('docs/ is current')
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
