# The Xcode project is generated from this file (xcodegen), so the checked-in
# .xcodeproj can be rebuilt rather than hand-edited:  cd ios && xcodegen
name: EVRoutePlanner
options:
  bundleIdPrefix: com.routesection
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  EVRoutePlanner:
    type: application
    platform: iOS
    sources:
      - path: RouteSection
      - path: Resources          # flat copy, so Bundle.main.url(forResource:"index") finds it
      - path: Assets.xcassets    # the app icon; App Store Connect rejects a build without one
    info:
      path: RouteSection/Info.plist
      properties:
        CFBundleDisplayName: EVRoute
        CFBundleName: EVRoute
        CFBundleShortVersionString: "2.7"
        CFBundleVersion: "1"
        UILaunchScreen: {}     # iOS 14+ : a plain background, no storyboard file needed
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIViewControllerBasedStatusBarAppearance: true
        NSLocationWhenInUseUsageDescription: >-
          Used only when you tap the crosshair in the Start field, to fill in
          where you are setting off from. Your location is never sent to us —
          this app has no server.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.routesection.evplanner
        # The marketing version follows the product, so a bug reported against
        # 2.7 means the same thing on both stores. The build number is App Store
        # Connect's own counter and starts at 1 — it has never seen this app.
        MARKETING_VERSION: "2.7"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone and iPad
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
