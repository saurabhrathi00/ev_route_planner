# The Xcode project is generated from this file (xcodegen), so the checked-in
# .xcodeproj can be rebuilt rather than hand-edited:  cd ios && xcodegen
name: EVRoutePlanner
options:
  bundleIdPrefix: com.routesection
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  EVRoutePlanner:
    type: application
    platform: iOS
    sources:
      - path: RouteSection
      - path: Resources          # flat copy, so Bundle.main.url(forResource:"index") finds it
    info:
      path: RouteSection/Info.plist
      properties:
        CFBundleDisplayName: EV Route Planner
        CFBundleName: EV Route Planner
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}     # iOS 14+ : a plain background, no storyboard file needed
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.routesection.evplanner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone and iPad
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
