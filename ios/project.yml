# The Xcode project is generated from this file (xcodegen), so the checked-in
# .xcodeproj can be rebuilt rather than hand-edited:  cd ios && xcodegen
name: EVRoutePlanner
options:
  bundleIdPrefix: com.routesection
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  EVRoutePlanner:
    type: application
    platform: iOS
    sources:
      - path: RouteSection
      - path: Resources          # flat copy, so Bundle.main.url(forResource:"index") finds it
      - path: Assets.xcassets    # the app icon; App Store Connect rejects a build without one
    info:
      path: RouteSection/Info.plist
      properties:
        CFBundleDisplayName: Safar
        CFBundleName: Safar
        CFBundleShortVersionString: "4.2"
        CFBundleVersion: "1"
        UILaunchScreen: {}     # iOS 14+ : a plain background, no storyboard file needed
        # Kept at all four even though the Split View rule that forced it was an
        # iPad one: on iPhone iOS ignores upside-down anyway, and leaving them
        # in place means iPad support can come back without this coming back
        # with it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIViewControllerBasedStatusBarAppearance: true
        # Every upload otherwise stops to ask whether the app uses encryption.
        # It does not use any of its own; HTTPS is exempt, which is what this
        # answers. Declaring it here means the question is never asked and the
        # answer cannot drift from build to build.
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          Used only when you tap the crosshair in the Start field, to fill in
          where you are setting off from. Your location is never sent to us —
          this app has no server.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.routesection.evplanner
        # The marketing version follows the product, so a bug reported against
        # 2.7 means the same thing on both stores. The build number is App Store
        # Connect's own counter and starts at 1 — it has never seen this app.
        MARKETING_VERSION: "4.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only for the first release. iPad is not dropped work so much as
        # deferred: declaring it means a second set of App Store screenshots and
        # a second device for review to find fault on, before anyone has said
        # the iPhone build is any good. Adding a device family later is routine;
        # taking one away after people have installed it is not, which is why
        # this is the moment to decide. It still runs on an iPad, at iPhone size.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
